name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin/arm64
            outdir: darwin-arm64
            artifacts: vhub/build/darwin-arm64/*.dmg
          - os: windows-latest
            platform: windows/amd64
            outdir: windows-amd64
            artifacts: vhub/build/windows-amd64/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      # go.mod replaces github.com/egoist/mygo => ../mygo, so the sibling
      # checkout must sit at ../mygo relative to this repo.
      - uses: actions/checkout@v4
        with:
          path: vhub
      - uses: actions/checkout@v4
        with:
          repository: egoist/mygo
          path: mygo
      - uses: actions/setup-go@v5
        with:
          go-version-file: vhub/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: vhub
      - name: Build
        run: go run ../mygo/cmd/mygo build -platform ${{ matrix.platform }} .
        working-directory: vhub
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.outdir }}
          path: ${{ matrix.artifacts }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
